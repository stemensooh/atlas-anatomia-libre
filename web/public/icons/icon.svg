<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/><stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="dot"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#38bdf8"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.9) translate(-256 -256)">
    <!-- órbita trasera (detrás de la figura) -->
    <path d="M 84 300 A 180 64 -18 0 1 428 212" fill="none" stroke="url(#orbit)" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
    <!-- figura humana -->
    <g fill="#e8e0c9">
      <circle cx="256" cy="126" r="40"/>
      <rect x="214" y="178" width="84" height="150" rx="40"/>
      <rect x="182" y="184" width="34" height="134" rx="17" transform="rotate(12 199 201)"/>
      <rect x="296" y="184" width="34" height="134" rx="17" transform="rotate(-12 313 201)"/>
      <rect x="219" y="306" width="34" height="132" rx="17"/>
      <rect x="259" y="306" width="34" height="132" rx="17"/>
    </g>
    <!-- corazón: punto de luz de la marca -->
    <circle cx="272" cy="226" r="26" fill="#38bdf8" opacity="0.28"/>
    <circle cx="272" cy="226" r="13" fill="url(#dot)"/>
    <!-- órbita delantera (por delante de la figura) -->
    <path d="M 428 212 A 180 64 -18 0 1 84 300" fill="none" stroke="url(#orbit)" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
