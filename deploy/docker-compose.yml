# API del Atlas Anatómico 3D Libre en producción (D-017). Guía: docs/DESPLIEGUE.md
# Uso en el VPS, desde la raíz del repositorio:
#   sudo docker compose -f deploy/docker-compose.yml up -d --build
#
# - network_mode: host → la API escucha en 127.0.0.1:3001 del VPS (HOST/PORT en api.env) y llega
#   a PostgreSQL en 127.0.0.1:5432 sin abrirlo a la red de Docker. Nginx hace de proxy en /api/.
# - Las credenciales viven SOLO en el VPS: /etc/atlas/api.env (permisos 600, no versionado).

name: atlas

services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: atlas-api:latest
    network_mode: host
    env_file:
      - /etc/atlas/api.env
    environment:
      # Techo del heap de V8 por debajo del límite del contenedor (VPS de 1 GB).
      NODE_OPTIONS: --max-old-space-size=192
    restart: unless-stopped
    mem_limit: 256m
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
