# Nginx — atlas.stemensoft.com (D-017). Guía: docs/DESPLIEGUE.md
# Copiar a /etc/nginx/sites-available/atlas.stemensoft.com y enlazar en sites-enabled.
# Se entrega solo en HTTP (puerto 80): `certbot --nginx -d atlas.stemensoft.com` añade el bloque
# HTTPS, los certificados y la redirección 80 → 443 automáticamente.

server {
    listen 80;
    listen [::]:80;
    server_name atlas.stemensoft.com;

    # Visor estático (web/dist). `current` es un enlace a la última versión publicada
    # por deploy/publicar-web.ps1 (releases/<fecha>).
    root /var/www/atlas/current;
    index index.html;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión: JS/CSS/JSON (metadata.json ~5 MB) y GLB (meshopt ya comprime, gzip aún ayuda).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    # --- API (contenedor Docker en 127.0.0.1:3001) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        # La API compara Origin con este host para rechazar CSRF (server/src/app.ts).
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        client_max_body_size 1m;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Archivos con hash en el nombre (Vite): caché de un año ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- Modelos 3D y metadatos (sin hash en el nombre): caché de 7 días ---
    location ~* ^/data/processed/.+\.glb$ {
        types { }
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location /data/processed/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- index.html: siempre revalidar para recoger la versión nueva ---
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- PWA (docs/PLAN_PWA.md): service worker, su registro y manifiesto, siempre revalidados ---
    # Si quedaran en caché, una versión nueva de la app tardaría días en llegar a los usuarios.
    location ~ ^/(sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
